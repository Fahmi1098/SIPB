name: Deploy SIPB to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Copy official Banten logo into static site
        run: cp inventory/logo_banten.png web/assets/logo_banten.png
      - name: Copy official Banten logo into static site
        run: cp inventory/logo_banten.png web/assets/logo_banten.png
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
