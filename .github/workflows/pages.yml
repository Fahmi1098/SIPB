name: Deploy SIPB to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application JavaScript
        run: node --check web/assets/app.js
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PostgreSQL migration statement syntax
        run: |
          python -m pip install --quiet pglast
          python -c "from pathlib import Path; from pglast import parse_sql; paths = ['supabase/migrations/20261102090000_security_integrity_followup.sql', 'supabase/migrations/20261102110000_transaction_corrections.sql']; [parse_sql(Path(p).read_text(encoding='utf-8')) for p in paths]; print('SQL statement syntax OK:', ', '.join(paths))"
  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Copy official Banten logo into static site
        run: cp inventory/logo_banten.png web/assets/logo_banten.png
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
